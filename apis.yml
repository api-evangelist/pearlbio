name: Pearlbio
description: Pearl Bio is a synthetic biology company developing next-generation biomaterials for smart
  biologics. Its proprietary platform unites genome and ribosome engineering to produce novel biologics
  with diverse chemistries previously inaccessible, creating template-directed biomaterials with tunable
  properties by combining biological precision with chemical diversity. The company partnered with Merck
  on cancer-related biologics (announced March 2024) and is backed by Khosla Ventures. Pearl Bio operates
  as a research-and-partnership organization and publishes no public API, developer portal, or SDKs.
